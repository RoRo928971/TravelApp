<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>旅のしおり — ふたりの共同編集プランナー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;600;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FAF4E9;--paper-2:#F3EAD8;--card:#FFFDF8;--ink:#2B2620;--ink-soft:#7A7063;
    --line:#E6DCC8;--pine:#16453C;--pine-2:#1F5C50;--persimmon:#D9603B;--persimmon-soft:#FBEAE2;
    --gold:#C99A3F;--shadow:0 18px 40px -22px rgba(43,38,32,.45);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{font-family:"Zen Kaku Gothic New",sans-serif;color:var(--ink);
    background:radial-gradient(120% 80% at 0% 0%, #2a5048 0%, transparent 55%),radial-gradient(120% 90% at 100% 100%, #b9502f 0%, transparent 50%),#143f37;
    min-height:100dvh;display:flex;justify-content:center;align-items:flex-start;padding:18px 12px 40px;}
  body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:9999;opacity:.05;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");}
  .app{width:100%;max-width:430px;background:var(--paper);border-radius:30px;overflow:hidden;position:relative;
    box-shadow:var(--shadow),0 0 0 1px rgba(255,255,255,.06);min-height:86dvh;}

  header{background:linear-gradient(160deg,var(--pine) 0%,var(--pine-2) 80%);color:#F6EFE0;padding:20px 22px 26px;position:relative;overflow:hidden;}
  header::after{content:"";position:absolute;right:-40px;top:-50px;width:170px;height:170px;border-radius:50%;
    background:radial-gradient(circle at 30% 30%, rgba(217,96,59,.55), transparent 65%);}
  .brandrow{display:flex;justify-content:space-between;align-items:center;position:relative;z-index:1}
  .brand{font-family:"Shippori Mincho",serif;font-weight:700;font-size:15px;letter-spacing:.22em;color:#EBD9B6}
  .brand small{display:block;font-family:"Fraunces",serif;font-style:italic;font-size:10px;letter-spacing:.18em;opacity:.7;font-weight:500}
  .headtools{display:flex;align-items:center;gap:10px}
  .reset-btn{border:none;background:rgba(255,255,255,.12);color:#EBD9B6;width:30px;height:30px;border-radius:50%;
    cursor:pointer;display:grid;place-items:center;transition:.2s}
  .reset-btn:hover{background:rgba(255,255,255,.22)}
  .reset-btn svg{width:15px;height:15px}
  .avatars{display:flex;align-items:center;cursor:pointer}
  .av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:14px;border:2px solid var(--pine);box-shadow:0 2px 6px rgba(0,0,0,.25);position:relative;transition:.2s}
  .av.me{background:#EBD9B6;color:var(--pine);z-index:2}
  .av.partner{background:var(--persimmon);color:#fff;margin-left:-10px;z-index:1}
  .av.active{box-shadow:0 0 0 2px var(--pine),0 0 0 4px #EBD9B6}
  .av.partner.active{box-shadow:0 0 0 2px var(--pine),0 0 0 4px var(--persimmon)}
  .av .dot{position:absolute;right:-1px;bottom:-1px;width:11px;height:11px;border-radius:50%;background:#7BD389;border:2px solid var(--pine)}
  .title{font-family:"Shippori Mincho",serif;font-size:30px;font-weight:800;margin-top:18px;line-height:1.15;position:relative;z-index:1;outline:none}
  .title:focus{background:rgba(255,255,255,.1);border-radius:8px}
  .meta{display:flex;gap:14px;margin-top:10px;font-size:12.5px;color:#D9CBA9;position:relative;z-index:1}
  .meta b{font-family:"Fraunces",serif;font-weight:600;color:#F6EFE0;font-size:13px}
  .actingline{margin-top:6px;font-size:11px;color:#D9CBA9;position:relative;z-index:1}
  .actingline b{color:#F6EFE0}
  .presence{margin:12px 0 -8px;display:flex;align-items:center;gap:8px;font-size:12px;color:#EBD9B6;position:relative;z-index:1}
  .pulse{width:8px;height:8px;border-radius:50%;background:var(--persimmon);box-shadow:0 0 0 0 rgba(217,96,59,.6);animation:pulse 1.8s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(217,96,59,.55)}70%{box-shadow:0 0 0 9px rgba(217,96,59,0)}100%{box-shadow:0 0 0 0 rgba(217,96,59,0)}}

  .tabs{display:flex;gap:6px;padding:14px 18px 0;background:var(--paper);position:sticky;top:0;z-index:20}
  .tab{flex:1;border:none;background:transparent;font-family:"Zen Kaku Gothic New";font-weight:700;font-size:14px;color:var(--ink-soft);
    padding:12px 0 14px;cursor:pointer;position:relative;transition:color .25s;display:flex;align-items:center;justify-content:center;gap:7px;}
  .tab .badge{font-family:"Fraunces",serif;font-size:11px;background:var(--paper-2);color:var(--ink-soft);border-radius:20px;padding:1px 8px;transition:.25s}
  .tab.active{color:var(--pine)}
  .tab.active .badge{background:var(--pine);color:#F6EFE0}
  .tab .ink-bar{position:absolute;bottom:0;left:50%;transform:translateX(-50%) scaleX(0);width:46px;height:3px;border-radius:3px;background:var(--persimmon);transition:transform .3s cubic-bezier(.5,1.6,.4,1)}
  .tab.active .ink-bar{transform:translateX(-50%) scaleX(1)}

  .content{padding:8px 18px 30px}
  .panel{display:none;animation:fade .4s ease both}
  .panel.show{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

  .day{margin-top:22px}
  .day-head{display:flex;align-items:baseline;gap:12px;margin-bottom:12px}
  .day-num{font-family:"Fraunces",serif;font-style:italic;font-size:13px;color:var(--persimmon);font-weight:600}
  .day-date{font-family:"Shippori Mincho",serif;font-weight:700;font-size:18px}
  .day-sub{font-size:11.5px;color:var(--ink-soft);margin-left:auto}

  .timeline{position:relative}
  .stop{display:flex;gap:12px;position:relative;padding:0 0 14px;animation:rise .5s ease both;}
  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .time{font-family:"Fraunces",serif;font-weight:600;font-size:14px;color:var(--ink);min-width:42px;padding-top:14px;text-align:right;outline:none;border-radius:5px}
  .time:focus{background:var(--persimmon-soft)}
  .rail{position:relative;width:14px;flex:none}
  .node{width:12px;height:12px;border-radius:50%;background:var(--paper);border:2.5px solid var(--pine);margin:17px auto 0;position:relative;z-index:2}
  .stop.bypartner .node{border-color:var(--persimmon)}
  .rail::before{content:"";position:absolute;left:50%;top:0;bottom:-2px;width:2px;background:var(--line);transform:translateX(-50%)}
  .stop:last-child .rail::before{display:none}

  .card{flex:1;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;
    box-shadow:0 6px 14px -12px rgba(43,38,32,.5);position:relative;transition:box-shadow .3s,border-color .3s;cursor:pointer;}
  .card-top{display:flex;gap:12px;padding:11px 13px;align-items:center}
  .thumb{width:54px;height:54px;border-radius:12px;overflow:hidden;flex:none;position:relative;box-shadow:inset 0 0 0 1px rgba(0,0,0,.05)}
  .thumb svg{width:100%;height:100%;display:block}
  .card-body{flex:1;min-width:0}
  .card .place{font-weight:700;font-size:15px;line-height:1.25;outline:none;border-radius:5px}
  .card .place:focus{background:var(--persimmon-soft)}
  .card .note{font-size:11.5px;color:var(--ink-soft);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;outline:none;border-radius:5px}
  .card .note:focus{background:var(--persimmon-soft);white-space:normal}
  .card .credit{display:flex;align-items:center;gap:5px;margin-top:7px;font-size:10.5px;color:var(--ink-soft)}
  .chip{width:16px;height:16px;border-radius:50%;display:grid;place-items:center;font-size:8.5px;font-weight:700;color:#fff}
  .chip.me{background:var(--pine)}
  .chip.partner{background:var(--persimmon)}
  .chev{align-self:center;color:var(--ink-soft);transition:transform .3s;flex:none}
  .card.open .chev{transform:rotate(180deg)}

  /* expandable store detail */
  .detail{max-height:0;overflow:hidden;transition:max-height .4s ease;border-top:0 solid var(--line)}
  .card.open .detail{max-height:420px;border-top:1px solid var(--line)}
  .hero{height:118px;position:relative}
  .hero svg{width:100%;height:100%;display:block}
  .hero .rating{position:absolute;top:9px;right:9px;background:rgba(20,20,18,.78);color:#fff;font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;display:flex;align-items:center;gap:4px;font-family:"Fraunces",serif}
  .hero .star{color:#F2C14E}
  .info{padding:12px 14px 6px}
  .inforow{display:flex;gap:9px;align-items:flex-start;font-size:12.5px;margin-bottom:9px}
  .inforow .ic{width:16px;flex:none;color:var(--persimmon);margin-top:1px}
  .inforow .k{color:var(--ink-soft);min-width:50px;flex:none}
  .inforow .v{font-weight:500}
  .actions{display:flex;gap:7px;padding:4px 14px 14px}
  .act{flex:1;border:1px solid var(--line);background:var(--paper);border-radius:11px;padding:9px 0;font-family:inherit;font-size:11.5px;font-weight:700;color:var(--pine);display:flex;align-items:center;justify-content:center;gap:5px;cursor:pointer;transition:.2s}
  .act:hover{background:var(--pine);color:#F6EFE0;border-color:var(--pine)}
  .act svg{width:14px;height:14px}
  .act.danger{color:var(--persimmon)}
  .act.danger:hover{background:var(--persimmon);border-color:var(--persimmon);color:#fff}

  .card.editing{border-color:var(--persimmon);box-shadow:0 0 0 2px var(--persimmon-soft),0 8px 18px -12px rgba(217,96,59,.6)}
  .editflag{position:absolute;top:-9px;right:12px;background:var(--persimmon);color:#fff;font-size:10px;font-weight:700;padding:2px 9px;border-radius:20px;display:flex;align-items:center;gap:5px;white-space:nowrap;z-index:5}
  .editflag.me{background:var(--pine)}
  .editflag .caret{width:5px;height:11px;background:#fff;border-radius:1px;animation:blink 1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}

  .addrow{display:flex;align-items:center;gap:10px;margin:2px 0 0 54px;padding:12px 14px;border:1.5px dashed var(--line);border-radius:14px;
    color:var(--ink-soft);font-size:13px;cursor:pointer;background:transparent;width:calc(100% - 54px);font-family:inherit;transition:.2s;}
  .addrow:hover{border-color:var(--pine);color:var(--pine)}
  .addrow .plus{font-size:17px;line-height:1}

  .grp{margin-top:20px}
  .grp-title{font-family:"Shippori Mincho",serif;font-weight:700;font-size:15px;display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .grp-title .who{font-size:10.5px;font-weight:700;color:#fff;padding:1px 9px;border-radius:20px;font-family:"Zen Kaku Gothic New"}
  .grp-title .who.both{background:var(--gold)}
  .item{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:13px;padding:11px 14px;margin-bottom:8px;cursor:pointer;transition:.2s;animation:rise .5s ease both;}
  .item:active{transform:scale(.99)}
  .box{width:21px;height:21px;border-radius:7px;border:2px solid var(--ink-soft);flex:none;display:grid;place-items:center;transition:.2s}
  .item.done .box{background:var(--pine);border-color:var(--pine)}
  .box svg{width:12px;height:12px;stroke:#fff;stroke-width:3.4;fill:none;stroke-dasharray:18;stroke-dashoffset:18;transition:stroke-dashoffset .3s ease .05s}
  .item.done .box svg{stroke-dashoffset:0}
  .item.done.bypartner .box{background:var(--persimmon);border-color:var(--persimmon)}
  .label{flex:1;font-size:14px;font-weight:500;transition:.2s;outline:none;border-radius:5px;padding:2px 4px;margin:-2px -4px}
  .label:focus{background:var(--persimmon-soft);cursor:text}
  .item.done .label{color:var(--ink-soft);text-decoration:line-through;text-decoration-color:var(--line)}
  .li-del{border:none;background:transparent;color:var(--ink-soft);cursor:pointer;font-size:13px;flex:none;opacity:.45;transition:.2s;width:20px;height:20px;border-radius:50%}
  .li-del:hover{opacity:1;color:var(--persimmon);background:var(--persimmon-soft)}
  .owner{width:19px;height:19px;border-radius:50%;display:grid;place-items:center;font-size:9px;font-weight:700;color:#fff;flex:none;cursor:pointer}
  .owner.me{background:var(--pine)}
  .owner.partner{background:var(--persimmon)}
  .additem{display:flex;align-items:center;gap:10px;background:transparent;border:1.5px dashed var(--line);border-radius:13px;padding:8px 12px;margin-top:2px}
  .additem input{flex:1;border:none;background:transparent;outline:none;font-family:inherit;font-size:14px;color:var(--ink)}
  .additem button{border:none;background:var(--pine);color:#F6EFE0;width:28px;height:28px;border-radius:50%;font-size:16px;cursor:pointer;flex:none}

  .hero .source{position:absolute;left:9px;bottom:9px;background:rgba(20,20,18,.7);color:#fff;font-size:9.5px;font-weight:600;padding:2px 9px;border-radius:20px;display:flex;align-items:center;gap:4px}
  .hero .source::before{content:"📍";font-size:9px}

  #overlay{position:absolute;inset:0;z-index:500;background:rgba(20,18,16,.42);opacity:0;pointer-events:none;transition:opacity .3s;display:flex;align-items:flex-end}
  #overlay.show{opacity:1;pointer-events:auto}
  .sheet{background:var(--paper);width:100%;border-radius:24px 24px 0 0;padding:10px 18px 22px;transform:translateY(100%);transition:transform .35s cubic-bezier(.3,1,.4,1);max-height:84%;display:flex;flex-direction:column;box-shadow:0 -10px 40px -10px rgba(0,0,0,.4)}
  #overlay.show .sheet{transform:none}
  .sheet-grab{width:40px;height:4px;border-radius:4px;background:var(--line);margin:4px auto 12px}
  .sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
  .sheet-title{font-family:"Shippori Mincho",serif;font-weight:700;font-size:17px}
  .sheet-x{border:none;background:var(--paper-2);width:30px;height:30px;border-radius:50%;font-size:13px;cursor:pointer;color:var(--ink-soft)}
  .searchbar{display:flex;align-items:center;gap:9px;background:var(--card);border:1px solid var(--line);border-radius:13px;padding:11px 13px}
  .searchbar svg{width:17px;height:17px;color:var(--persimmon);flex:none}
  .searchbar input{border:none;background:transparent;outline:none;font-family:inherit;font-size:14px;width:100%;color:var(--ink)}
  .sheet-hint{font-size:11px;color:var(--ink-soft);margin:10px 2px 4px;display:flex;align-items:center;gap:5px}
  .results{overflow-y:auto;margin-top:4px}
  .result{display:flex;align-items:center;gap:12px;padding:10px 4px;border-bottom:1px solid var(--line);cursor:pointer;transition:.15s}
  .result:hover{background:var(--paper-2);border-radius:10px}
  .r-thumb{width:46px;height:46px;border-radius:11px;overflow:hidden;flex:none}
  .r-thumb svg{width:100%;height:100%;display:block}
  .r-body{flex:1;min-width:0}
  .r-name{font-weight:700;font-size:14px}
  .r-meta{font-size:11px;color:var(--ink-soft);margin-top:2px}
  .r-star{color:var(--gold);font-family:"Fraunces",serif;font-weight:600}
  .r-add{border:none;background:var(--pine);color:#F6EFE0;width:30px;height:30px;border-radius:50%;font-size:17px;cursor:pointer;flex:none}
  .r-empty{text-align:center;color:var(--ink-soft);font-size:13px;padding:24px}
  .toast .tdot.me{background:var(--pine)}
  .toast .tdot.sys{background:var(--gold)}

  #cursor{position:absolute;z-index:300;pointer-events:none;left:50%;top:40%;transition:left .9s cubic-bezier(.5,0,.2,1),top .9s cubic-bezier(.5,0,.2,1);opacity:0}
  #cursor svg{filter:drop-shadow(0 2px 3px rgba(0,0,0,.3))}
  #cursor .tag{position:absolute;left:14px;top:16px;background:var(--persimmon);color:#fff;font-size:10px;font-weight:700;padding:2px 8px;border-radius:0 10px 10px 10px;white-space:nowrap}
  #toasts{position:absolute;left:0;right:0;bottom:18px;display:flex;flex-direction:column;align-items:center;gap:8px;z-index:400;pointer-events:none;padding:0 18px}
  .toast{background:var(--ink);color:#F6EFE0;font-size:12.5px;padding:9px 14px;border-radius:30px;display:flex;align-items:center;gap:8px;
    box-shadow:0 10px 24px -10px rgba(0,0,0,.5);opacity:0;transform:translateY(14px);animation:toast 3.6s ease forwards;max-width:100%;}
  @keyframes toast{8%{opacity:1;transform:none}88%{opacity:1;transform:none}100%{opacity:0;transform:translateY(-6px)}}
  .toast .tdot{width:18px;height:18px;border-radius:50%;background:var(--persimmon);display:grid;place-items:center;font-size:9px;font-weight:700;flex:none}
</style>
</head>
<body>
<div class="app" id="app">
  <header>
    <div class="brandrow">
      <div class="brand">旅のしおり<small>FUTARI TABI · KYOTO</small></div>
      <div class="headtools">
        <button class="reset-btn" id="reset" title="最初から（デモを再生）">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
        </button>
        <div class="avatars" id="avatars" title="操作中のユーザーを切替">
          <div class="av me active" id="av-me">ハ</div>
          <div class="av partner" id="av-partner">ユ<span class="dot"></span></div>
        </div>
      </div>
    </div>
    <div class="title" id="trip-title" contenteditable spellcheck="false">京都 ふたり旅</div>
    <div class="meta"><span><b>3.14</b> 金 — <b>3.16</b> 日</span><span>2泊3日</span></div>
    <div class="actingline">いま操作中： <b id="acting-name">ハル</b>（タップで交代）</div>
    <div class="presence"><span class="pulse"></span><span id="presence-text">ユカリさんが編集中…</span></div>
  </header>

  <div class="tabs">
    <button class="tab active" data-panel="plan"><span>行程</span><span class="badge" id="plan-count">8</span><span class="ink-bar"></span></button>
    <button class="tab" data-panel="pack"><span>持ち物・やること</span><span class="badge" id="pack-count">3/9</span><span class="ink-bar"></span></button>
  </div>

  <div class="content">
    <section class="panel show" id="plan">
      <div class="day"><div class="day-head"><span class="day-num">Day 1</span><span class="day-date">3月14日</span><span class="day-sub">金 · 京都着</span></div>
        <div class="timeline" id="day1"></div>
        <button class="addrow" data-day="day1"><span class="plus">＋</span>予定を追加</button></div>
      <div class="day"><div class="day-head"><span class="day-num">Day 2</span><span class="day-date">3月15日</span><span class="day-sub">土 · 嵐山</span></div>
        <div class="timeline" id="day2"></div>
        <button class="addrow" data-day="day2"><span class="plus">＋</span>予定を追加</button></div>
    </section>
    <section class="panel" id="pack">
      <div class="grp"><div class="grp-title">持ち物<span class="who both">共通</span></div><div id="list-common"></div>
        <div class="additem"><input id="add-common" placeholder="持ち物を追加（例：充電器）"><button data-list="common">＋</button></div></div>
      <div class="grp"><div class="grp-title">やること<span class="who both">予約・準備</span></div><div id="list-todo"></div>
        <div class="additem"><input id="add-todo" placeholder="やることを追加（例：宿の予約）"><button data-list="todo">＋</button></div></div>
    </section>
  </div>

  <div id="overlay">
    <div class="sheet">
      <div class="sheet-grab"></div>
      <div class="sheet-head"><div class="sheet-title">場所を追加</div><button class="sheet-x" id="sheet-close">✕</button></div>
      <div class="searchbar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg>
        <input id="sheet-q" placeholder="店名・スポットを検索（例: 伏見、カフェ）">
      </div>
      <div class="sheet-hint">📍 地図サービスから写真とお店情報を自動取得します</div>
      <div class="results" id="results"></div>
    </div>
  </div>

  <div id="cursor"><svg width="22" height="22" viewBox="0 0 24 24"><path d="M4 2 L4 20 L9 15 L13 22 L16 20 L12 13 L19 13 Z" fill="#D9603B" stroke="#fff" stroke-width="1.3"/></svg><span class="tag">ユカリ</span></div>
  <div id="toasts"></div>
</div>

<script>
/* ============================================================
   旅のしおり — ふたりで共同編集する旅行プランナー（プロトタイプ）
   - 単一HTML / 外部API・画像なしで自己完結
   - 場所情報は地図サービス風モックDBから自動取得
   - 共同編集は色分け（あなた=深緑 / 相手=柿色）＋疑似プレゼンスで再現
   - 内容は localStorage に保存。初回のみ相手のリアルタイム編集デモを再生
   ============================================================ */

/* ---------- 状態・永続化 ---------- */
const KEY='tabi-no-shiori-v2';
let state;
const firstRun = !localStorage.getItem(KEY);
function load(){ try{ const r=localStorage.getItem(KEY); if(r){ state=JSON.parse(r); return; } }catch(e){} state=seed(); }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }
function getItem(key,id){ return state.days[key].find(s=>s.id===id); }

/* ---------- 行程レンダリング ---------- */
const openSet=new Set();
function stopHTML(s){
  const i=s.info, u=USERS[s.by];
  return `<div class="stop ${s.by==='partner'?'bypartner':''}" data-id="${s.id}">
    <div class="time" contenteditable spellcheck="false">${s.time}</div><div class="rail"><div class="node"></div></div>
    <div class="card ${s.editing?'editing':''}" data-card="${s.id}">
      ${s.editing?`<div class="editflag ${s.editingBy||'partner'}">${USERS[s.editingBy||'partner'].name} <span class="caret"></span></div>`:''}
      <div class="card-top">
        <div class="thumb">${scene(s.scene)}</div>
        <div class="card-body"><div class="place" contenteditable spellcheck="false">${s.place}</div><div class="note" contenteditable spellcheck="false">${s.note}</div>
          <div class="credit"><span class="chip ${s.by}">${u.ini}</span>${u.name}が${s.editing?'編集中':'担当'}</div></div>
        <svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M6 9l6 6 6-6"/></svg>
      </div>
      <div class="detail">
        <div class="hero">${scene(s.scene)}${i.rate!=='—'?`<div class="rating"><span class="star">★</span>${i.rate}</div>`:''}${i.rate!=='—'?'<div class="source">地図サービスより</div>':''}</div>
        <div class="info">
          <div class="inforow"><span class="ic">${I.clock}</span><span class="k">営業時間</span><span class="v">${i.hours}</span></div>
          <div class="inforow"><span class="ic">${I.yen}</span><span class="k">予算</span><span class="v">${i.budget}</span></div>
          <div class="inforow"><span class="ic">${I.tag}</span><span class="k">カテゴリ</span><span class="v">${i.tag}</span></div>
          <div class="inforow"><span class="ic">${I.pin}</span><span class="k">住所</span><span class="v">${i.addr}</span></div>
        </div>
        <div class="actions">
          <button class="act" data-act="map">${I.map}地図</button>
          <button class="act" data-act="swap">${I.swap}担当交代</button>
          <button class="act danger" data-act="del">${I.trash}削除</button>
        </div>
      </div>
    </div></div>`;
}
function renderDay(key){
  const el=document.getElementById(key);
  el.innerHTML=state.days[key].map(stopHTML).join('');
  el.querySelectorAll('.stop').forEach((st,idx)=>{
    st.style.animationDelay=(idx*0.07)+'s';
    const id=st.dataset.id, item=getItem(key,id);
    const card=st.querySelector('.card');
    if(openSet.has(id)) card.classList.add('open');

    // カード開閉
    card.addEventListener('click',e=>{
      if(e.target.closest('.act')||e.target.closest('[contenteditable]')) return;
      card.classList.toggle('open');
      if(card.classList.contains('open')) openSet.add(id); else openSet.delete(id);
    });
    // 時刻編集
    bindEdit(st.querySelector('.time'), card, v=>{ item.time=v||item.time; }, ()=>{ state.days[key].sort((a,b)=>a.time.localeCompare(b.time)); renderDay(key); });
    // 場所名
    bindEdit(st.querySelector('.place'), card, v=>{ item.place=v||item.place; });
    // メモ
    bindEdit(st.querySelector('.note'), card, v=>{ item.note=v; });

    // アクション
    st.querySelector('[data-act="map"]').addEventListener('click',e=>{e.stopPropagation();toast(`「${item.place}」を地図で開きます（モック）`,'sys');});
    st.querySelector('[data-act="swap"]').addEventListener('click',e=>{e.stopPropagation();
      item.by = item.by==='me'?'partner':'me'; save(); renderDay(key);
      toast(`「${item.place}」の担当を${USERS[item.by].name}に交代`,acting);});
    st.querySelector('[data-act="del"]').addEventListener('click',e=>{e.stopPropagation();
      state.days[key]=state.days[key].filter(x=>x.id!==id); openSet.delete(id); save(); renderDay(key);
      toast(`「${item.place}」を削除しました`,acting);});
  });
  updatePlanCount();
}
// contenteditable 共通処理：focusで編集中表示、blurで保存
function bindEdit(elm, card, apply, after){
  if(!elm) return;
  elm.addEventListener('mousedown',e=>e.stopPropagation());
  elm.addEventListener('focus',()=>{
    if(card){ card.classList.add('editing'); markFlag(card,acting,true); }
    setPresence(`${USERS[acting].name}さんが編集中…`);
  });
  elm.addEventListener('keydown',e=>{ if(e.key==='Enter'){e.preventDefault(); elm.blur();} });
  elm.addEventListener('blur',()=>{
    apply(elm.textContent.trim());
    if(card){ card.classList.remove('editing'); markFlag(card,null,false); }
    save(); idlePresence();
    if(after) after();
  });
}
function markFlag(card,user,on){
  let f=card.querySelector('.editflag');
  if(on){
    if(!f){ f=document.createElement('div'); f.className='editflag'; card.appendChild(f); }
    f.className='editflag '+user;
    f.innerHTML=`${USERS[user].name} <span class="caret"></span>`;
  }else if(f){ f.remove(); }
}
function updatePlanCount(){ document.getElementById('plan-count').textContent=state.days.day1.length+state.days.day2.length; }

/* ---------- タブ ---------- */
const tabs=[...document.querySelectorAll('.tab')];
tabs.forEach(t=>t.addEventListener('click',()=>{
  tabs.forEach(x=>x.classList.remove('active'));
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('show'));
  t.classList.add('active');document.getElementById(t.dataset.panel).classList.add('show');
}));

/* ---------- 持ち物・やること ---------- */
const check='<svg viewBox="0 0 24 24"><polyline points="4 13 9 18 20 5"/></svg>';
const listEl={common:'list-common',todo:'list-todo'};
function renderList(name){
  const list=state[name], el=document.getElementById(listEl[name]); el.innerHTML='';
  list.forEach((it,idx)=>{
    const d=document.createElement('div');
    d.className='item'+(it.done?' done':'')+(it.o==='partner'?' bypartner':'');d.style.animationDelay=(idx*0.05)+'s';
    d.innerHTML=`<div class="box">${check}</div><div class="label" contenteditable spellcheck="false">${it.t}</div><button class="li-del" title="削除">✕</button><div class="owner ${it.o}">${USERS[it.o].ini}</div>`;
    // 行クリックで完了トグル（編集要素・所有者・削除以外）
    d.addEventListener('click',e=>{
      if(e.target.closest('.label')||e.target.closest('.owner')||e.target.closest('.li-del')) return;
      it.done=!it.done; if(it.done) it.o=acting; save(); renderList(name); updateCount();
    });
    // テキスト編集
    const lab=d.querySelector('.label');
    lab.addEventListener('mousedown',e=>e.stopPropagation());
    lab.addEventListener('focus',()=>setPresence(`${USERS[acting].name}さんが編集中…`));
    lab.addEventListener('keydown',e=>{ if(e.key==='Enter'){e.preventDefault();lab.blur();} });
    lab.addEventListener('blur',()=>{ const v=lab.textContent.trim(); if(v){it.t=v;}else{lab.textContent=it.t;} save(); idlePresence(); });
    // 担当切替
    d.querySelector('.owner').addEventListener('click',e=>{e.stopPropagation();
      it.o=it.o==='me'?'partner':'me'; save(); renderList(name);});
    // 削除
    d.querySelector('.li-del').addEventListener('click',e=>{e.stopPropagation();
      const t=it.t; state[name]=state[name].filter(x=>x!==it); save(); renderList(name); updateCount();
      toast(`「${t}」を削除しました`,acting);});
    el.appendChild(d);
  });
}
function addToList(name,text){
  text=text.trim(); if(!text) return;
  state[name].push({t:text,o:acting,done:false}); save(); renderList(name); updateCount();
  toast(`「${text}」を追加しました`,acting);
}
function updateCount(){const all=[...state.common,...state.todo];document.getElementById('pack-count').textContent=all.filter(x=>x.done).length+'/'+all.length;}
document.querySelectorAll('.additem button').forEach(b=>{
  const name=b.dataset.list, input=document.getElementById('add-'+name);
  b.addEventListener('click',()=>{ addToList(name,input.value); input.value=''; input.focus(); });
  input.addEventListener('keydown',e=>{ if(e.key==='Enter'){ addToList(name,input.value); input.value=''; } });
});

/* ---------- 操作中ユーザー切替 ---------- */
function setActing(u){
  acting=u;
  document.getElementById('av-me').classList.toggle('active',u==='me');
  document.getElementById('av-partner').classList.toggle('active',u==='partner');
  document.getElementById('acting-name').textContent=USERS[u].name;
}
document.getElementById('avatars').addEventListener('click',()=>{
  setActing(acting==='me'?'partner':'me');
  toast(`${USERS[acting].name}として操作中`,acting);
});

titleEl.addEventListener('blur',()=>{ const v=titleEl.textContent.trim(); if(v){state.title=v;}else{titleEl.textContent=state.title;} save(); });

/* ---------- プレゼンス表示 ---------- */
let presenceTimer;
function setPresence(t){ document.getElementById('presence-text').textContent=t; }
function idlePresence(){ clearTimeout(presenceTimer); presenceTimer=setTimeout(()=>setPresence('ふたりで編集中'),1800); }

/* ---------- トースト＆カーソル ---------- */
function toast(msg,who){who=who||'partner';const box=document.getElementById('toasts');const el=document.createElement('div');el.className='toast';const a=who==='me'?'ハ':(who==='sys'?'📍':'ユ');el.innerHTML=`<span class="tdot ${who}">${a}</span>${msg}`;box.appendChild(el);setTimeout(()=>el.remove(),who==='sys'?1000:3600);}
const cur=document.getElementById('cursor'),app=document.getElementById('app');
function moveTo(elm,dx=0,dy=0){if(!elm)return;const a=app.getBoundingClientRect(),r=elm.getBoundingClientRect();cur.style.opacity='1';cur.style.left=(r.left-a.left+r.width*0.5+dx)+'px';cur.style.top=(r.top-a.top+r.height*0.5+dy)+'px';}

/* ---------- 場所検索 → 自動入力 ---------- */
const placeDB=[
 {q:'伏見稲荷大社',scene:'torii',time:'10:00',info:{hours:'終日参拝可',budget:'無料',addr:'伏見区 深草',tag:'寺社',rate:'4.7'}},
 {q:'八坂神社',scene:'gion',time:'17:30',info:{hours:'終日参拝可',budget:'無料',addr:'東山区 祇園町',tag:'寺社',rate:'4.5'}},
 {q:'二年坂・三年坂',scene:'kiyomizu',time:'13:30',info:{hours:'散策自由',budget:'無料',addr:'東山区',tag:'散策',rate:'4.4'}},
 {q:'％アラビカ 京都 東山',scene:'cafe',time:'15:30',info:{hours:'8:00–18:00',budget:'¥600〜',addr:'東山区 星野町',tag:'カフェ',rate:'4.3'}},
 {q:'南禅寺',scene:'kiyomizu',time:'11:00',info:{hours:'8:40–17:00',budget:'¥600',addr:'左京区 南禅寺',tag:'寺社',rate:'4.5'}},
 {q:'平等院 鳳凰堂',scene:'kinkaku',time:'14:00',info:{hours:'8:30–17:30',budget:'¥600',addr:'宇治市 宇治蓮華',tag:'寺社',rate:'4.6'}},
 {q:'嵐山温泉 足湯',scene:'onsen',time:'17:30',info:{hours:'9:00–18:00',budget:'¥200',addr:'右京区 嵯峨天龍寺',tag:'温泉',rate:'4.2'}},
];
let sheetDay='day1';
function openSheet(day){sheetDay=day;const q=document.getElementById('sheet-q');q.value='';renderResults('');document.getElementById('overlay').classList.add('show');setTimeout(()=>q.focus(),300);}
function closeSheet(){document.getElementById('overlay').classList.remove('show');}
function renderResults(q){
  const box=document.getElementById('results');
  const list=placeDB.filter(p=>p.q.includes(q)||p.info.tag.includes(q)||p.info.addr.includes(q));
  if(!list.length){box.innerHTML='<div class="r-empty">該当する場所がありません</div>';return;}
  box.innerHTML=list.map(p=>`<div class="result" data-i="${placeDB.indexOf(p)}">
    <div class="r-thumb">${scene(p.scene)}</div>
    <div class="r-body"><div class="r-name">${p.q}</div>
      <div class="r-meta"><span class="r-star">★ ${p.info.rate}</span> · ${p.info.tag} · ${p.info.addr}</div></div>
    <button class="r-add">＋</button></div>`).join('');
  box.querySelectorAll('.result').forEach(r=>r.addEventListener('click',()=>addPlace(+r.dataset.i)));
}
function addPlace(i){
  const p=placeDB[i];
  closeSheet();
  toast('地図から写真と情報を取得中…','sys');
  setTimeout(()=>{
    state.days[sheetDay].push({id:'u'+i+Date.now(),time:p.time,place:p.q,note:p.info.tag+'・'+p.info.addr,by:acting,scene:p.scene,info:Object.assign({},p.info)});
    state.days[sheetDay].sort((a,b)=>a.time.localeCompare(b.time));
    save(); renderDay(sheetDay);
    toast(`「${p.q}」を追加しました`,acting);
  },1000);
}
document.querySelectorAll('.addrow').forEach(b=>b.addEventListener('click',()=>openSheet(b.dataset.day||'day1')));
document.getElementById('sheet-q').addEventListener('input',e=>renderResults(e.target.value));
document.getElementById('sheet-close').addEventListener('click',closeSheet);
document.getElementById('overlay').addEventListener('click',e=>{if(e.target.id==='overlay')closeSheet();});

/* ---------- リセット（デモ再生） ---------- */
document.getElementById('reset').addEventListener('click',()=>{
  if(confirm('編集内容を消して、最初の状態（デモ）に戻しますか？')){ localStorage.removeItem(KEY); location.reload(); }
});

/* ---------- 初回のみ：相手のリアルタイム編集デモ ---------- */
function playDemo(){
 const script=[
  {at:2600,run:()=>moveTo(document.querySelector('[data-card="gion"]'))},
  {at:4000,run:()=>{const g=getItem('day1','gion'); if(!g)return; g.place='祇園 ぎをん 八咫';g.note='京懐石・要予約';g.editing=false;
    g.info={hours:'17:30–22:00',budget:'¥8,000〜',addr:'東山区 祇園町南側',tag:'京懐石',rate:'4.7'};
    save();renderDay('day1');toast('「祇園で夕食」のお店を決めました');}},
  {at:8000,run:()=>{setPresence('ユカリさんが持ち物を見ています…');document.querySelector('.tab[data-panel="pack"]')&&moveTo(document.querySelector('#list-common .item'));}},
  {at:9400,run:()=>{const it=state.common[0]; if(it){it.done=true;save();renderList('common');updateCount();toast('「'+it.t+'」を完了にしました');}}},
  {at:12500,run:()=>{setPresence('ユカリさんが Day2 を編集中…');moveTo(document.querySelectorAll('.addrow')[1]);}},
  {at:13900,run:()=>{state.days.day2.push({id:'ons',time:'17:30',place:'嵐山温泉で足湯',note:'帰り道にひと休み',by:'partner',scene:'onsen',
    info:{hours:'9:00–18:00',budget:'¥200',addr:'右京区 嵯峨天龍寺',tag:'温泉',rate:'4.2'}});
    state.days.day2.sort((a,b)=>a.time.localeCompare(b.time));save();renderDay('day2');toast('Day2 に「嵐山温泉で足湯」を追加しました');}},
  {at:16000,run:()=>{setPresence('ふたりで編集中');cur.style.opacity='0';}},
 ];
 setTimeout(()=>script.forEach(s=>setTimeout(s.run,s.at)),800);
}

/* ---------- 初期化 ---------- */
function init(){
  load();
  titleEl.textContent=state.title||'京都 ふたり旅';
  setActing('me');
  renderDay('day1'); renderDay('day2');
  renderList('common'); renderList('todo'); updateCount();
  if(firstRun){ save(); playDemo(); }    // 初回だけデモ再生（保存して再読込時は再生しない）
  else { setPresence('ふたりで編集中'); document.querySelector('.pulse').style.animation='none'; }
}
init();
</script>
